name: Build YouTube Plus Tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      # Единый стандарт кэша: тулчейн восстанавливается целиком, установка
      # пропускается при попадании. Переменные окружения выставляются всегда —
      # без них make не найдёт THEOS даже на попадании в кэш.
      - name: Cache Theos + iOS SDK
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-sdk16.5-v1

      - name: Set Theos env
        run: |
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install Theos + iOS toolchain
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/theos/theos "$THEOS"
          brew install ldid dpkg xz

      - name: Install iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/theos/sdks.git /tmp/theos-sdks
          # MEASURED: полное клонирование = 95s из 291s. Sparse-checkout берёт одну папку.
          git -C /tmp/theos-sdks sparse-checkout set iPhoneOS16.5.sdk
          git -C /tmp/theos-sdks checkout
          # В репо SDK хранятся РАЗЛОЖЕННЫМИ ДИРЕКТОРИЯМИ, а не тарболлами.
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/SDKSettings.plist"
          echo "SDK installed:" && ls "$THEOS/sdks"

      - name: Build tweak (real Theos build)
        run: |
          set -e
          make clean || true
          make package FINALPACKAGE=1
          ls -la packages/

      - name: Extract dylib from .deb
        run: |
          set -e
          mkdir -p dist
          cp packages/*.deb dist/
          DEB=$(ls packages/*.deb | head -1)
          dpkg-deb -x "$DEB" /tmp/debroot
          find /tmp/debroot -name "*.dylib" -exec cp {} dist/YouTubePlus.dylib \;
          ls -la dist/

      - name: Upload build artifact (.deb + .dylib)
        uses: actions/upload-artifact@v4
        with:
          name: YouTubePlus-tweak
          path: dist/*
          if-no-files-found: error
